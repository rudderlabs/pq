name: 'staticcheck'
on:
  pull_request:
    paths: ['**.go', 'go.mod', '.github/workflows/*']
  push:
    branches: ['main', 'master']

permissions:
  contents: read

jobs:
  staticcheck:
    name:    'staticcheck'
    runs-on: 'ubuntu-latest'
    env:     {cache: 'staticcheck'}
    steps:
      # Setup
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

      # Store and restore staticcheck only from master branch.
      - id:   'cache-restore'
        uses: 'actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25' # v5.1.0
        with:
          key: 'staticcheck'
          path: |
            ${{ runner.temp }}/staticcheck
            /home/runner/.cache/go-build
          restore-keys: |
            staticcheck
      - uses: 'actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16' # v6.5.0
        with: {go-version: 'stable'}
      - uses: 'actions/cache@caa296126883cff596d87d8935842f9db880ef25' # v5.1.0
        with:
          key: 'staticcheck'
          path: |
            ${{ runner.temp }}/staticcheck
            ${{ steps.install_go.outputs.GOCACHE || '' }}

      # Run
      - run: |
          export STATICCHECK_CACHE="${{ runner.temp }}/staticcheck"
          go install honnef.co/go/tools/cmd/staticcheck@latest

          fail=0
          for a in $(go tool dist list); do
            export GOOS=${a%%/*}
            export GOARCH=${a#*/}

            case "$GOOS" in
              (android|ios)  continue ;; # Requires cgo to link.
            esac

            f=
            echo "==> $a"
            go vet ./...      || fail=1
            staticcheck ./... || fail=1
          done
          exit $fail

      # Store cache, only on master branch
      - uses: 'actions/cache/save@caa296126883cff596d87d8935842f9db880ef25' # v5.1.0
        if:   "github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'"
        with:
          key: 'staticcheck'
          path: |
            ${{ runner.temp }}/staticcheck
            /home/runner/.cache/go-build
